schema_version: "1.1"
name: post-full-path
description: "linkedin-post runs brief, draft, humanizer and gate, and saves learned patterns only to profile/"
tags: [core]
runs: 3
execution:
  prompt: |
    Help me write a LinkedIn post about the carrier onboarding story. Everything you need is in my story bank: I sat with the onboarding desk for a week, saw insurance documents sitting in an inbox, and we automated insurance checks with two providers. Onboarding went from 9 days to 2 and drop-off from 30% to 11% in one quarter. Don't ask me questions, draft it now and take it all the way through.
  max_turns: 60
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash(ls:*), Bash(mkdir:*)]
context:
  scaffold_script: fixture.sh
graders:
  - name: phase0-brief
    type: regex
    weight: 1
    pattern: "STAGE:"
  - name: check-table
    type: regex
    weight: 1
    pattern: "RULES: *[0-5]/5"
  - name: check-table-smallest-fix-column
    type: regex
    weight: 1
    flags: i
    pattern: "Smallest fix"
  - name: playbook-loaded
    type: tool_used
    tool: Skill
    min: 1
    input_match: "linkedin-funnel-playbook"
  - name: humanizer-loaded
    type: tool_used
    tool: Skill
    min: 1
    input_match: "the-humanizer"
  - name: post-saved
    type: file_exists
    path: posts/*.md
    exists: true
  - name: post-uses-real-numbers
    type: llm
    weight: 2
    criteria: |
      Find the final LinkedIn post. PASS if it is about carrier onboarding and its numbers match the user's: 9 days to 2, and drop-off 30% to 11%. FAIL if any number in the post contradicts these.
  - name: post-no-em-dash-or-emoji
    type: llm
    weight: 1
    criteria: |
      Look only at the final LinkedIn post itself (not tables or notes around it). PASS if it contains no em-dash character and no emoji. FAIL otherwise.
  - name: post-strong-opening
    type: llm
    weight: 1
    criteria: |
      Look only at the final LinkedIn post. PASS if its first paragraph (before the first blank line) is roughly 210 characters or fewer and opens on a concrete number, scene or event rather than a general claim. FAIL otherwise.
  - name: post-no-bait-close
    type: llm
    weight: 1
    criteria: |
      Look only at the final LinkedIn post. PASS if it does not end on engagement bait such as 'Agree?', 'Thoughts?' or 'Like if...'. A specific question about the reader's own experience is fine. FAIL otherwise.
  - name: never-edits-plugin-files
    type: tool_used
    arm: both
    tool: Edit
    min: 0
    max: 0
    input_match: "SKILL\\.md|/plugins/"
  - name: never-writes-plugin-files
    type: tool_used
    arm: both
    tool: Write
    min: 0
    max: 0
    input_match: "SKILL\\.md|/plugins/"
