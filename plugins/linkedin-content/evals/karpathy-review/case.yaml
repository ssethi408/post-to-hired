schema_version: "1.1"
name: karpathy-review
description: "karpathy-post-review returns the point, scorecard and quoted findings, not a rewrite"
tags: [core]
runs: 1
execution:
  prompt: |
    Karpathy this post:

    Last week I shut down a feature I had pitched myself. Only 4% of carriers used it, and it cost more to run than it earned.

    It was a hard decision but in today's fast-moving landscape, leaders must leverage data to drive impact and unlock value across the organization.

    What I learned: set a kill metric before you launch.

    Thoughts?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: format
    type: llm
    weight: 3
    criteria: |
      PASS if the reply states the post's point in one sentence, names a reader and goal, gives a scorecard for Think Before Writing, Simplicity and Goal-Driven, lists findings that quote exact lines from the post (the 'fast-moving landscape... leverage data...' line and the 'Thoughts?' close should be among them), and does not rewrite the post beyond its own findings. An 'edited post' that applies only the suggested changes (with placeholders for details only the author has) is allowed and expected when there are 3 or more findings. FAIL if the findings don't quote the post, or if it produces a rewrite with new content the findings didn't call for.

