schema_version: "1.1"
name: karpathy-review
description: "karpathy-post-review returns the point, scorecard and quoted findings, not a free rewrite"
tags: [core]
runs: 3
execution:
  prompt: |
    Karpathy this post:

    Last week I shut down a feature I had pitched myself. Only 4% of carriers used it, and it cost more to run than it earned.

    It was a hard decision but in today's fast-moving landscape, leaders must leverage data to drive impact and unlock value across the organization.

    What I learned: set a kill metric before you launch.

    Thoughts?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: states-the-point
    type: regex
    weight: 1
    flags: i
    pattern: "point, in one sentence"
  - name: has-scorecard
    type: regex
    weight: 1
    flags: i
    pattern: "Simplicity"
  - name: quotes-filler-line
    type: llm
    weight: 2
    criteria: |
      PASS if a finding quotes the 'fast-moving landscape ... leverage data ... unlock value' line and suggests cutting or replacing it. FAIL otherwise.
  - name: flags-thoughts-close
    type: llm
    weight: 1
    criteria: |
      PASS if a finding flags the closing 'Thoughts?' as too generic and suggests a narrower question. FAIL otherwise.
  - name: no-free-rewrite
    type: llm
    weight: 1
    criteria: |
      PASS unless the reply rewrites the post with new content its findings didn't call for. An edited post that applies only the suggested changes, with placeholders for details only the author has, is allowed.
