schema_version: "1.1"
name: should-not-fire
description: "LinkedIn skills must not trigger on an unrelated request"
tags: [core, negative]
runs: 3
execution:
  prompt: |
    Summarize the plot of Hamlet in two sentences.
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-linkedin-skill
    type: tool_used
    arm: both
    tool: Skill
    min: 0
    max: 0
    input_match: "linkedin|humanizer|karpathy"
  - name: answers-question
    type: llm
    weight: 1
    criteria: |
      PASS if the reply summarizes Hamlet. FAIL otherwise.
