schema_version: "1.1"
name: gate-weak-draft
description: "Playbook CHECK mode flags a weak, engagement-bait draft without rewriting it"
tags: [core]
runs: 3
execution:
  prompt: |
    Gate this:

    Excited to share some thoughts on the future of logistics!

    The industry is changing fast and innovation is key. Here are 5 lessons I've learned on my journey.

    1. Leverage data
    2. Put customers first
    3. Embrace change
    4. Build great teams
    5. Never stop learning

    Agree?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: check-format
    type: regex
    weight: 1
    pattern: "RULES: *[0-5]/5"
  - name: rule2-fails
    type: regex
    weight: 2
    flags: i
    pattern: "\\|\\s*2\\s*\\|[^\\n]*\\bFAIL\\b"
  - name: rule5-fails
    type: regex
    weight: 2
    flags: i
    pattern: "\\|\\s*5\\s*\\|[^\\n]*\\bFAIL\\b"
  - name: smallest-fix-column
    type: regex
    weight: 1
    flags: i
    pattern: "Smallest fix"
  - name: no-full-rewrite
    type: llm
    weight: 1
    criteria: |
      PASS if the reply does not contain a complete rewritten version of the post (one-line fixes, suggested opening lines and an offer to rewrite are fine). FAIL if it includes a full rewritten post.
