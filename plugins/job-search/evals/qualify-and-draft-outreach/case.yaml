schema_version: "1.1"
name: qualify-and-draft-outreach
description: "find-hiring-managers qualifies a post against targets and drafts outreach without sending"
tags: [core]
runs: 3
execution:
  prompt: |
    Here's a post I found on LinkedIn. Is it a fit, and what should I send them?

    Priya Raman (fictional), VP Product at Fernwick Logistics (fictional):
    "I'm hiring a Director of Product for my team at Fernwick Logistics. You'll lead our carrier onboarding and payments squads (3 PMs). Remote in the US. If you've fixed a messy onboarding funnel in freight, I want to talk to you. Posted 2 days ago."
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: fixture.sh
graders:
  - name: has-verdict
    type: regex
    weight: 2
    pattern: "\\b(Pursue|Maybe|Pass)\\b"
  - name: scores-against-targets
    type: llm
    weight: 1
    criteria: |
      PASS if the reply scores the lead on role, level, location and industry (or equivalent) against the user's targets. FAIL otherwise.
  - name: connection-note-short
    type: llm
    weight: 1
    criteria: |
      PASS if the reply includes a LinkedIn connection note that is clearly under 300 characters. FAIL otherwise.
  - name: message-uses-real-result
    type: llm
    weight: 1
    criteria: |
      PASS if the outreach message mentions the onboarding result (9 days to 2) and ties it to what the poster asked for. FAIL otherwise.
  - name: no-invented-connection
    type: llm
    weight: 1
    criteria: |
      PASS if the outreach does not claim a mutual connection, shared employer or past meeting. FAIL otherwise.
  - name: does-not-send
    type: llm
    weight: 1
    criteria: |
      PASS if nothing in the reply claims a message or connection request was sent on the user's behalf. FAIL otherwise.
