schema_version: "1.1"
name: tracker-warm-intro-followups
description: "pipeline-tracker records a warm intro, then sets the 1-business-day follow-up after the intro is made"
tags: [core]
runs: 3
execution:
  prompt: |
    Add this to my tracker: Director of Product at Fernwick Logistics, remote US, from a LinkedIn post by Priya Raman (VP Product), found today, fit score 18. We're connected through Dev Kapoor, and I asked Dev for an intro today.
    Then: Dev just introduced me to Priya. Update the tracker and tell me what's next and when.
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash(ls:*), Bash(mkdir:*), Bash(date:*)]
context:
  scaffold_script: fixture.sh
graders:
  - name: new-columns-in-header
    type: regex
    weight: 2
    pattern: "notes,connection,warm_intro"
    target: {source: file, path: tracker/pipeline.csv}
  - name: warm-intro-recorded
    type: regex
    weight: 2
    pattern: "Dev Kapoor"
    target: {source: file, path: tracker/pipeline.csv}
  - name: intro-made-status
    type: regex
    weight: 2
    pattern: "Intro made"
    target: {source: file, path: tracker/pipeline.csv}
  - name: next-step-one-business-day
    type: llm
    weight: 2
    criteria: |
      PASS if the reply says the next step is to message Priya and gives a due date that is one business day from today (written as a real date), not later. FAIL otherwise.
  - name: no-sending
    type: llm
    weight: 1
    criteria: |
      PASS if nothing in the reply claims a message was sent to Priya or Dev on the user's behalf. FAIL otherwise.
