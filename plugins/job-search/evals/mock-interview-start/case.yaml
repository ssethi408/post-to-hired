schema_version: "1.1"
name: mock-interview-start
description: "mock-interview runs the researcher agent, shows a short brief without the question list, and asks at most one question"
tags: [core, slow]
runs: 3
execution:
  prompt: |
    Run a short mock interview for the Director of Product role at Haulspring, hiring manager round. The real interview is next Tuesday. I don't know who the interviewer is. Here's the posting:

    Director of Product, Carrier Experience — Haulspring (fictional company)
    Remote (US)

    Haulspring is a Series C freight marketplace connecting 40,000 trucking carriers with shippers.

    You will lead 3 product managers and own carrier onboarding, payments and the carrier mobile app.

    Requirements:
    - 8+ years in product management, 2+ managing product managers
    - Experience in logistics, freight or marketplaces
    - Track record of improving activation or onboarding funnels with data
    - Experience with payments products
    - Strong partnership with operations and sales
    - Comfortable making and explaining trade-offs to executives
    - Mobile product experience a plus
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Agent, Bash, WebSearch, WebFetch]
context:
  scaffold_script: fixture.sh
graders:
  - name: researcher-agent-used
    type: regex
    weight: 2
    pattern: "interview-researcher"
    target: trace
  - name: resume-was-used
    type: llm
    weight: 1
    criteria: |
      PASS unless the reply says the resume could not be opened or read, or that the brief is based on profile files only. FAIL if it says that.
  - name: short-brief
    type: llm
    weight: 1
    criteria: |
      PASS if the reply gives a short prep summary: the few things to land and the gaps likely to be probed. FAIL otherwise.
  - name: hides-question-list
    type: llm
    weight: 2
    criteria: |
      PASS if the reply does not list the planned interview questions. FAIL if it shows the question plan.
  - name: at-most-one-question
    type: llm
    weight: 1
    criteria: |
      Prep advice inside the brief (what to emphasize, how to handle a gap) is expected and fine. Judge only what comes after the brief. PASS if the reply then either asks whether the user is ready to start or asks exactly one interview question. FAIL if it asks two or more interview questions.
  - name: no-invented-company-facts
    type: llm
    weight: 2
    criteria: |
      The posting says only: Series C freight marketplace, 40,000 carriers, lead 3 PMs, own carrier onboarding, payments and the carrier mobile app, remote US. PASS if no line spoken as the interviewer states company or team facts beyond these (such as team size beyond 3 PMs, open headcount, org structure, named internal problems or strategy). FAIL otherwise.
