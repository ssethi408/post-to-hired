schema_version: "1.1"
name: mock-interview-start
description: "mock-interview runs the researcher agent, shows a short brief without the question list, and asks exactly one question"
tags: [core, slow]
runs: 1
execution:
  prompt: |
    Run a short mock interview for the Director of Product role at Haulspring, hiring manager round. The real interview is next Tuesday. I don't know who the interviewer is. Here's the posting:

    Director of Product, Carrier Experience — Haulspring (fictional company)
    Remote (US)

    Haulspring is a Series C freight marketplace connecting 40,000 trucking carriers with shippers.

    You will lead 3 product managers and own carrier onboarding, payments and the carrier mobile app.

    Requirements:
    - 8+ years in product management, 2+ managing product managers
    - Experience in logistics, freight or marketplaces
    - Track record of improving activation or onboarding funnels with data
    - Experience with payments products
    - Strong partnership with operations and sales
    - Comfortable making and explaining trade-offs to executives
    - Mobile product experience a plus
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Agent, WebSearch, WebFetch]
context:
  scaffold_script: fixture.sh
graders:
  - name: researcher-agent-used
    type: regex
    weight: 2
    pattern: "interview-researcher"
    target: trace
  - name: brief-then-one-question
    type: llm
    weight: 3
    criteria: |
      PASS if the reply gives a short prep summary (the few things to land and the gaps likely to be probed) without listing the planned interview questions, and then either asks 'ready to start?' or asks exactly one interview question in the hiring manager's voice. FAIL if it lists the question plan, asks more than one interview question, gives coaching on answers, or has the interviewer state specific company or team facts that are not in the posting (for example team size or headcount beyond '3 product managers', org structure, named internal problems or strategy). The posting says: Series C freight marketplace, 40,000 carriers, lead 3 PMs, own carrier onboarding, payments and the carrier mobile app, remote US.

