schema_version: "1.1"
name: mock-interview-debrief
description: "mock-interview debrief scores answers, rewrites weak ones without inventing facts, and asks before saving"
tags: [core, slow]
runs: 3
execution:
  prompt: |
    We just finished a mock interview for the Director of Product role at Haulspring (hiring manager round). Debrief me now. Here's the transcript:

    Q1 (interviewer): Tell me about a time you improved an onboarding funnel.
    A1 (me): At Quillmoor, carriers took 9 days to get approved and 30% dropped off. I sat with the onboarding desk for a week, found most of the delay was insurance documents, and we automated insurance checks with two providers. Onboarding went to 2 days and drop-off fell to 11% in a quarter.

    Q2 (interviewer): How do you handle disagreements with sales?
    A2 (me): Um, I think it's really about communication and alignment, you know, we just kind of worked it out together as a team and it was fine.

    Q2 follow-up (interviewer): What did you do, specifically?
    A2b (me): We had some meetings and figured it out.

    end
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Agent, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: debrief-instructions-used
    type: regex
    weight: 2
    pattern: "interview-debrief"
    target: trace
  - name: resume-was-read
    type: llm
    weight: 2
    criteria: |
      PASS unless the reply says the resume could not be opened or read, or that claims were checked against profile notes instead of the resume. FAIL if it says that.
  - name: has-readiness
    type: llm
    weight: 1
    criteria: |
      PASS if the reply gives a readiness score from 1 to 10. FAIL otherwise.
  - name: a1-beats-a2
    type: llm
    weight: 1
    criteria: |
      Q1 is the onboarding-funnel answer; Q2 is the disagreements-with-sales answer. PASS if the reply rates Q1 as stronger than Q2, in scores or in words. FAIL only if it rates Q2 as equal to or stronger than Q1.
  - name: per-dimension-scores
    type: llm
    weight: 1
    criteria: |
      PASS if answers are scored on separate rubric dimensions (for example structure, specifics, ownership), not only one overall number. FAIL otherwise.
  - name: rewrite-uses-real-story
    type: llm
    weight: 2
    criteria: |
      Here is the candidate's story bank:
      # About me: story bank

      ## Career summary
      Senior product manager with 11 years in B2B software, the last 6 in logistics. I lead a team of 4 PMs at Quillmoor Freight (fictional), a freight platform of about 600 people, where I own carrier onboarding and payments. Before that I was a PM at a payroll startup and started out as a business analyst at a freight brokerage, so I've sat on the operations side of the products I build.

      ## Stories

      ### Story: carrier onboarding from 9 days to 2
      - Situation: new trucking carriers took 9 days on average to get approved, and about 30% gave up before their first load.
      - What I did: sat with the onboarding team for a week, found that 60% of the delay was waiting on insurance documents, and shipped automatic insurance checks with two providers instead of manual review.
      - Result: onboarding dropped to 2 days and drop-off fell from 30% to 11% in one quarter.
      - Lesson: the slow step is usually a handoff between people, not the software.
      - Good for questions about: delivery, using data, customer empathy

      ### Story: killing the quick-pay feature I pitched
      - Situation: I championed same-day payment for carriers. Six months in, only 4% of carriers used it and it cost more to run than it earned.
      - What I did: brought the numbers to my VP myself before the quarterly review, recommended shutting it down, and moved the two engineers to the onboarding work.
      - Result: we shut it down in 3 weeks with no customer complaints; the onboarding work above came out of that freed-up team.
      - Lesson: I now set a kill metric before launch, written down, for every bet.
      - Good for questions about: failure, ownership, prioritization

      ### Story: disagreeing with sales about custom contracts
      - Situation: sales wanted custom pricing logic for each of our 5 largest shippers. Engineering estimated a quarter of work for each one.
      - What I did: pulled 18 months of contract data, showed that 4 of the 5 needs fit into three pricing rules, and proposed building those three rules instead.
      - Result: sales agreed after a pilot with one shipper; we shipped the rules in 7 weeks and covered 4 of the 5 accounts.
      - Lesson: bring the data to the person who disagrees before the meeting, not in it.
      - Good for questions about: conflict, influence, stakeholder management

      ### Story: hiring my first PM [private: interview only]
      - Situation: my first hire as a manager left after 5 months.
      - What I did: asked for an honest exit conversation, learned I'd hired for skills and never discussed how much ambiguity the role had. Rewrote the interview loop with a written case on a messy, real problem.
      - Result: the next 3 hires are all still on the team two years later.
      - Lesson: describe the worst week of the job in the interview.
      - Good for questions about: leadership, hiring, learning from mistakes

      PASS if the rewrite of the sales answer is built from a real story in this story bank (the pricing-rules disagreement with sales fits) and every number, name and event in it appears in the story bank, the resume facts or the transcript, with missing specifics marked [ADD: ...]. A detail inferred from the story and marked [confirm: ...] is allowed. FAIL if it contains an unmarked number, name or event found in none of those.
  - name: asks-before-saving
    type: llm
    weight: 1
    criteria: |
      PASS if the reply asks before saving files or adding stories, or does not save anything. FAIL if it says it already saved files or edited the story bank without asking.
