schema_version: "1.1"
name: mock-interview-debrief
description: "mock-interview debrief scores answers, rewrites weak ones without inventing facts, and asks before saving"
tags: [core, slow]
runs: 3
execution:
  prompt: |
    We just finished a mock interview for the Director of Product role at Haulspring (hiring manager round). Debrief me now. Here's the transcript:

    Q1 (interviewer): Tell me about a time you improved an onboarding funnel.
    A1 (me): At Quillmoor, carriers took 9 days to get approved and 30% dropped off. I sat with the onboarding desk for a week, found most of the delay was insurance documents, and we automated insurance checks with two providers. Onboarding went to 2 days and drop-off fell to 11% in a quarter.

    Q2 (interviewer): How do you handle disagreements with sales?
    A2 (me): Um, I think it's really about communication and alignment, you know, we just kind of worked it out together as a team and it was fine.

    Q2 follow-up (interviewer): What did you do, specifically?
    A2b (me): We had some meetings and figured it out.

    end
  max_turns: 50
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Agent, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: debrief-agent-used
    type: regex
    weight: 2
    pattern: "interview-debrief"
    target: trace
  - name: has-readiness
    type: llm
    weight: 1
    criteria: |
      PASS if the reply gives a readiness score from 1 to 10. FAIL otherwise.
  - name: a1-beats-a2
    type: llm
    weight: 1
    criteria: |
      Q1 is the onboarding-funnel answer; Q2 is the disagreements-with-sales answer. PASS if the reply rates Q1 as stronger than Q2, in scores or in words. FAIL only if it rates Q2 as equal to or stronger than Q1.
  - name: per-dimension-scores
    type: llm
    weight: 1
    criteria: |
      PASS if answers are scored on separate rubric dimensions (for example structure, specifics, ownership), not only one overall number. FAIL otherwise.
  - name: rewrite-uses-real-story
    type: llm
    weight: 2
    criteria: |
      PASS if the rewrite of the sales answer uses only real facts from the candidate's materials (for example the pricing-rules disagreement with sales: 18 months of contract data, 3 pricing rules, 4 of 5 shippers, 7 weeks) or marks missing specifics as [ADD: ...]. FAIL if it invents numbers, names or events.
  - name: asks-before-saving
    type: llm
    weight: 1
    criteria: |
      PASS if the reply asks before saving files or adding stories, or does not save anything. FAIL if it says it already saved files or edited the story bank without asking.
