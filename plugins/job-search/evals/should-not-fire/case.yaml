schema_version: "1.1"
name: should-not-fire
description: "Job-search skills must not trigger on an unrelated request"
tags: [core, negative]
runs: 1
execution:
  prompt: |
    Convert 72 degrees Fahrenheit to Celsius. One line.
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-job-skill
    type: tool_used
    arm: both
    tool: Skill
    min: 0
    max: 0
    input_match: "tailor|hiring|tracker|interview"
  - name: answers-question
    type: llm
    criteria: |
      PASS if the reply gives about 22 degrees Celsius. FAIL otherwise.

