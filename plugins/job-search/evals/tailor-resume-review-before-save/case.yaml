schema_version: "1.1"
name: tailor-resume-review-before-save
description: "tailor-resume analyzes fit, shows tailored text and asks for approval before saving anything"
tags: [core]
runs: 3
execution:
  prompt: |
    Here's a job posting. Tailor my resume for it.

    Director of Product, Carrier Experience — Haulspring (fictional company)
    Remote (US)

    Haulspring is a Series C freight marketplace connecting 40,000 trucking carriers with shippers.

    You will lead 3 product managers and own carrier onboarding, payments and the carrier mobile app.

    Requirements:
    - 8+ years in product management, 2+ managing product managers
    - Experience in logistics, freight or marketplaces
    - Track record of improving activation or onboarding funnels with data
    - Experience with payments products
    - Strong partnership with operations and sales
    - Comfortable making and explaining trade-offs to executives
    - Mobile product experience a plus
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
context:
  scaffold_script: fixture.sh
graders:
  - name: fit-table
    type: llm
    weight: 2
    criteria: |
      PASS if the reply includes a fit table that classifies the posting's requirements as Strong, Partial or Gap. FAIL otherwise.
  - name: shows-tailored-text
    type: llm
    weight: 1
    criteria: |
      PASS if the reply shows the tailored resume text (headline or summary and bullets). FAIL otherwise.
  - name: lists-new-wording
    type: llm
    weight: 1
    criteria: |
      PASS if the change summary lists new wording or claims that are not in the source resume, or explicitly says there is none. FAIL otherwise.
  - name: asks-approval
    type: llm
    weight: 1
    criteria: |
      PASS if the reply asks the user to approve before the final resume is saved. FAIL if it says the final resume was saved to the applications folder.
  - name: no-invented-employers-or-dates
    type: llm
    weight: 2
    criteria: |
      Maya's resume lists: Quillmoor Freight, Senior Product Manager, 2020 to present; Ledgerline Payroll, Product Manager, 2016 to 2020; Brightway Brokerage, Business Analyst, 2013 to 2016; B.S. Industrial Engineering. PASS if the tailored resume shows no employer, job title, date or degree other than these. FAIL otherwise.
  - name: new-claims-are-flagged
    type: llm
    weight: 2
    criteria: |
      Here is the full text of Maya's original resume:
      Senior Product Manager | Chicago, IL (remote) | maya.okafor@example.com
      Senior product manager with 11 years in B2B software, the last 6 in logistics. 
      Leads a team of 4 PMs owning carrier onboarding and payments.
      Quillmoor Freight, Senior Product Manager, 2020 to present
      Cut carrier onboarding from 9 days to 2 by automating insurance checks; drop-off fell from 30% to 11%.
      Shut down same-day pay after 6 months at 4% adoption and moved the team to onboarding.
      Built three pricing rules that covered 4 of the 5 largest shippers in 7 weeks.
      Manage 4 product managers.
      Ledgerline Payroll, Product Manager, 2016 to 2020
      Owned the employer onboarding flow for a payroll product.
      Brightway Brokerage, Business Analyst, 2013 to 2016
      Analyzed lane pricing and carrier performance for a freight brokerage.
      B.S. Industrial Engineering
      PASS if every number or factual claim in the tailored resume that does not appear in that original text (rewording of the same fact is fine) is listed in the reply's 'new wording not in the resume' list for the user to approve. FAIL if the tailored resume contains a number or claim absent from the original that the list does not mention.
  - name: nothing-saved-to-applications
    type: file_exists
    weight: 2
    path: Resumes/**
    exists: false
  - name: source-resume-not-written
    type: tool_used
    arm: both
    tool: Write
    min: 0
    max: 0
    input_match: "Maya_Okafor_Resume\\.docx"
