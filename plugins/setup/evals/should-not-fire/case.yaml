schema_version: "1.1"
name: should-not-fire
description: "Setup must not trigger on an unrelated request"
tags: [core, negative]
runs: 1
execution:
  prompt: |
    What are three good day hikes near Seattle for a beginner? Answer in three short lines.
  max_turns: 5
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: setup-not-loaded
    type: tool_used
    arm: both
    tool: Skill
    min: 0
    max: 0
    input_match: "setup"
  - name: answers-question
    type: llm
    criteria: |
      PASS if the reply names hikes near Seattle. FAIL if it talks about job search setup or profiles.

