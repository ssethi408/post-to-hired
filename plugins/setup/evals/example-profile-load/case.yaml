schema_version: "1.1"
name: example-profile-load
description: "Loads the fictional example profile into profile/, marked as the example, with the privacy check"
tags: [core]
runs: 3
execution:
  prompt: |
    Set me up with the example profile so I can try the skills first. This folder is my job search working folder.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash(git:*), Bash(ls:*)]
context:
  scaffold_script: fixture.sh
graders:
  - name: author-copied-and-marked
    type: regex
    weight: 2
    pattern: "EXAMPLE PROFILE"
    target: {source: file, path: profile/author.md}
  - name: voice-copied
    type: regex
    weight: 1
    pattern: "My voice"
    target: {source: file, path: profile/voice.md}
  - name: about-me-copied
    type: regex
    weight: 1
    pattern: "carrier onboarding"
    target: {source: file, path: profile/about-me.md}
  - name: readme-not-copied
    type: file_exists
    path: profile/README.md
    exists: false
  - name: gitignore-protects-profile
    type: regex
    weight: 2
    pattern: "profile/"
    target: {source: file, path: .gitignore}
  - name: says-its-fictional
    type: llm
    weight: 1
    criteria: |
      PASS if the final reply tells the user the loaded profile is fictional (Maya Okafor). FAIL otherwise.
  - name: says-resume-needed
    type: llm
    weight: 1
    criteria: |
      PASS if the final reply says resume tailoring or mock interviews need the user's own real resume (for example set in profile/settings.md). FAIL otherwise.
  - name: never-edits-plugin-files
    type: tool_used
    arm: both
    tool: Edit
    min: 0
    max: 0
    input_match: "SKILL\\.md|/plugins/"
  - name: never-writes-plugin-files
    type: tool_used
    arm: both
    tool: Write
    min: 0
    max: 0
    input_match: "SKILL\\.md|/plugins/"
